# The live rotation of MESHY-034. Two server nodes on one tunnel, and an sshd in
# each so that meshy reaches them the way it reaches a real node. The scenario
# runs on the runner and drives the CLI against the published ports.
name: meshy-rotate

services:
  node-a:
    image: meshy-rotate:local
    build:
      context: .
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "2221:22"
    volumes:
      - ./run/authorized_key:/run/meshy/authorized_key:ro

  node-b:
    image: meshy-rotate:local
    build:
      context: .
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "2222:22"
    volumes:
      - ./run/authorized_key:/run/meshy/authorized_key:ro
