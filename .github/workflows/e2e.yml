name: e2e

# The live mesh runs here and nowhere else. It needs root, /dev/net/tun, and a
# container runtime. A failure in this file names the mesh, so it stays apart
# from the unit job in ci.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mesh:
    name: live mesh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # The runner may hold no TUN device. Every step here is idempotent, so a
      # runner that has one keeps it.
      - name: Create the TUN device
        run: sudo mkdir -p /dev/net && ([ -e /dev/net/tun ] || sudo mknod /dev/net/tun c 10 200) && sudo chmod 666 /dev/net/tun
      - name: Read the pinned Nebula version
        id: nebula
        run: |
          version="$(awk '/^[^[:space:]#]/{b=$1} b=="nebula:" && /^[[:space:]]+version:/{print $2; exit}' test/e2e/mesh.yml | tr -d '"')"
          if [ -z "$version" ]; then
            echo "::error::test/e2e/mesh.yml holds no nebula.version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The archive and each member that the image needs are checked against the
      # digests that the release publishes.
      - name: Download and verify the pin
        env:
          VERSION: ${{ steps.nebula.outputs.version }}
        run: |
          asset="nebula-linux-amd64.tar.gz"
          base="https://github.com/slackhq/nebula/releases/download/$VERSION"
          curl -fsSL "$base/SHASUM256.txt" -o "$RUNNER_TEMP/SHASUM256.txt"
          curl -fsSL "$base/$asset" -o "$RUNNER_TEMP/$asset"
          want="$(awk -v name="$asset" '$2 == name {print $1}' "$RUNNER_TEMP/SHASUM256.txt")"
          if [ -z "$want" ]; then
            echo "::error::SHASUM256.txt names no $asset"
            exit 1
          fi
          echo "$want  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" nebula nebula-cert
          for member in nebula nebula-cert; do
            want="$(awk -v name="$asset/$member" '$2 == name {print $1}' "$RUNNER_TEMP/SHASUM256.txt")"
            if [ -z "$want" ]; then
              echo "::error::SHASUM256.txt names no $asset/$member"
              exit 1
            fi
            echo "$want  $RUNNER_TEMP/$member" | sha256sum -c -
          done
      - name: Build the image
        run: |
          mkdir -p test/e2e/.build
          install -m 0755 "$RUNNER_TEMP/nebula" test/e2e/.build/nebula
          # The image is Alpine, so the harness must be static. Without this the
          # binary is linked against the runner's glibc and the container cannot
          # exec it, which reads as "no such file or directory".
          CGO_ENABLED=0 go build -o test/e2e/.build/harness ./test/e2e/harness
          docker build -t meshy-e2e:local test/e2e
      - name: Render the configs
        run: go run ./test/e2e/generate -mesh test/e2e -binary "$RUNNER_TEMP/nebula-cert" -out test/e2e/generated
      - name: Check the compose file
        run: docker compose -f test/e2e/compose.yml config > /dev/null
      - name: Run the mesh
        run: timeout 90 docker compose -f test/e2e/compose.yml up --abort-on-container-exit --exit-code-from harness
      - name: Tear down
        if: always()
        run: docker compose -f test/e2e/compose.yml down -v
