name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Scaffold a mesh and validate it
        run: |
          go run ./cmd/meshy init --name smoke --cidr 10.42.0.0/24 --owner nobody "$RUNNER_TEMP/smoke"
          go run ./cmd/meshy validate --mesh "$RUNNER_TEMP/smoke"
